<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala VIP Bac Bo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
}

.hidden{ display:none; }

.login-box{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
}

input{
    padding:12px;
    width:250px;
    margin:10px;
    border-radius:6px;
    border:none;
}

button{
    padding:10px 20px;
    background:#00f2ff;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    padding:20px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    width:200px;
}

h1{
    color:#00f2ff;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-box">
    <h2>🔐 SALA VIP BAC BO</h2>
    <input type="password" id="password" placeholder="Digite a senha">
    <button onclick="login()">Entrar</button>
    <p id="error" style="color:red;"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
    <div class="container">
        <h1>👑 SALA VIP BAC BO</h1>

        <div class="stats">
            <div class="card">
                <h3>Winrate</h3>
                <p id="winrate">0%</p>
            </div>

            <div class="card">
                <h3>Lucro</h3>
                <p id="profit">$0</p>
            </div>

            <div class="card">
                <h3>Próximo Sinal</h3>
                <p id="signal">Aguardando...</p>
            </div>
        </div>

        <canvas id="chart"></canvas>
        <br>
        <button onclick="logout()">Sair</button>
    </div>
</div>

<script>
const SENHA = "bacboplayboyesmael";

let wins = 0;
let losses = 0;
let profit = 0;
let historyData = [];
let chart;

function login(){
    const pass = document.getElementById("password").value;
    if(pass === SENHA){
        document.getElementById("login").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        startSystem();
    } else {
        document.getElementById("error").innerText = "Senha incorreta!";
    }
}

function logout(){
    location.reload();
}

function startSystem(){
    const ctx = document.getElementById('chart').getContext('2d');

    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Lucro',
                data: [],
                borderColor: '#00f2ff',
                backgroundColor: 'rgba(0,242,255,0.2)',
                tension: 0.3
            }]
        }
    });

    setInterval(generateSignal, 4000);
}

function generateSignal(){
    const signals = ["PLAYER 🔵", "BANKER 🔴"];
    const result = signals[Math.floor(Math.random() * signals.length)];
    document.getElementById("signal").innerText = result;

    const win = Math.random() > 0.3;

    if(win){
        wins++;
        profit += 50;
    } else {
        losses++;
        profit -= 50;
    }

    const total = wins + losses;
    const winrate = ((wins/total)*100).toFixed(1);

    document.getElementById("winrate").innerText = winrate + "%";
    document.getElementById("profit").innerText = "$" + profit;

    historyData.push(profit);
    chart.data.labels.push(total);
    chart.data.datasets[0].data = historyData;
    chart.update();
}
</script>

</body>
</html>
